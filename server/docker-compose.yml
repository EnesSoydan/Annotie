services:
  relay:
    build: .
    container_name: annotie-relay
    # Değerler server/.env dosyasından okunur (bkz. .env.example).
    # Varsayılan yalnızca bu makineden erişim: TLS'li bir reverse proxy (Caddy)
    # arkasında yayınlayın. Aynı LAN'daki istemciler doğrudan bağlanacaksa
    # .env içinde RELAY_BIND_ADDR=0.0.0.0 ayarlayın.
    ports:
      - "${RELAY_BIND_ADDR:-127.0.0.1}:8765:8765"
    restart: unless-stopped
    # Kimlik doğrulama ZORUNLU: SUPABASE_URL + SUPABASE_ANON_KEY verilmezse relay
    # başlamaz. Yalnızca güvenilir LAN/test için RELAY_INSECURE_OPEN=1.
    environment:
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:-}"
      RELAY_INSECURE_OPEN: "${RELAY_INSECURE_OPEN:-0}"
